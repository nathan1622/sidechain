<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Contact · Sidechain</title>
    <meta name="description" content="Contact Sidechain. Audio production end to end, from Belgium." />
    <link rel="canonical" href="https://sidechain.global/contact/" />

    <meta property="og:title" content="Contact · Sidechain" />
    <meta property="og:description" content="Contact Sidechain. Audio production end to end, from Belgium." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sidechain.global/contact/" />
    <meta property="og:image" content="https://sidechain.global/og-card.png" />
    <meta property="og:site_name" content="Sidechain" />
    <meta property="og:locale" content="en" />

    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#000000" />

    <link rel="stylesheet" href="/style.css?v=38" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Sidechain",
        "legalName": "Sound Waves CommV",
        "url": "https://sidechain.global",
        "logo": "https://sidechain.global/brand/icon-512.png",
        "email": "hello@sidechain.global",
        "telephone": "+32472349624",
        "vatID": "BE0670983741",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Donderveldstraat 33",
          "postalCode": "3540",
          "addressLocality": "Herk-de-Stad",
          "addressCountry": "BE"
        }
      }
    </script>
  </head>

  <body>

    <!-- Same environment as the home page: the landscape does not restart or
         change when you cross to this page. -->
    <div class="env" aria-hidden="true">
      <div class="env-media">
        <video class="env-video" autoplay muted loop playsinline preload="auto">
          <source src="/hero-loop.mp4" type="video/mp4; codecs=avc1.4d401f" />
        </video>
      </div>

      <div class="env-weather">
        <div class="env-mist env-mist-a"></div>
        <div class="env-mist env-mist-b"></div>
      </div>

      <div class="env-veil"></div>
    </div>


    <!-- Pinned to the corner rather than sitting in the content: it is the
         way back, not part of what this page says. -->
    <a class="backHome" href="/" aria-label="Back to the Sidechain home page">
      <img class="backMark" src="/logo.svg" width="40" height="40" alt="" />
      <span class="backWord">Sidechain</span>
    </a>

    <main class="scroll">
      <section class="ch ch-contact">
        <div class="chInner">

          <h1 class="chLabel">
            <span class="chRule"></span>
            <span class="chName">Contact</span>
          </h1>

          <!-- Posts by fetch and confirms in place: nobody leaves the page
               and no mail client opens. Needs an access key in the script
               below before it can actually send. -->
          <form class="msg" id="msg" novalidate>
            <div class="field">
              <label for="f-name">Name</label>
              <input id="f-name" name="name" type="text" autocomplete="name" required />
            </div>

            <div class="field">
              <label for="f-mail">Email</label>
              <input id="f-mail" name="email" type="email" autocomplete="email" required />
            </div>

            <div class="field">
              <label for="f-msg">Message</label>
              <textarea id="f-msg" name="message" rows="4" required></textarea>
            </div>

            <!-- Bots fill this in; people never see it. -->
            <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" />

            <button class="btn" type="submit">Send</button>
            <p class="msgStatus" id="msgStatus" role="status" aria-live="polite"></p>
          </form>

          <!-- The identification a Belgian business site has to carry. The
               registered entity is still Sound Waves, so it is named here
               rather than quietly replaced by the brand. -->
          <address class="details">
            <a class="detailsLink" href="mailto:hello@sidechain.global">hello@sidechain.global</a>
            <a class="detailsLink" href="tel:+32472349624">+32 472 34 96 24</a>

            <span class="detailsName">Sidechain is a trading name of Sound Waves CommV</span>
            Donderveldstraat 33<br />
            3540 Herk-de-Stad<br />
            Belgium<br />
            <span class="detailsVat">Company number 0670.983.741 &middot; VAT BE 0670.983.741</span>
          </address>

          <p class="legalLinks">
            <a href="/terms/">General terms and conditions</a>
            <a href="/privacy/">Privacy</a>
          </p>

        </div>
      </section>
    </main>

    <script>
      // ── Message form ────────────────────────────────────────────────
      // Web3Forms access key. Public by design — it only identifies which
      // form a submission belongs to, and the endpoint accepts it from the
      // browser. If a send is refused the fallback points at the address.
      var FORM_KEY = '48a53cae-e78b-4d18-bea0-d893c89e3eb8';

      (function () {
        var form   = document.getElementById('msg');
        var status = document.getElementById('msgStatus');
        if (!form) return;

        form.addEventListener('submit', function (e) {
          e.preventDefault();

          var btn  = form.querySelector('button');
          var data = Object.fromEntries(new FormData(form).entries());

          if (!data.name || !data.email || !data.message) {
            status.className = 'msgStatus is-warn';
            status.textContent = 'Name, email and a message, please.';
            return;
          }

          btn.disabled = true;
          status.className = 'msgStatus';
          status.textContent = 'Sending';

          fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
            body: JSON.stringify({
              access_key: FORM_KEY,
              subject: 'Message from sidechain.global',
              from_name: 'Sidechain website',
              name: data.name,
              email: data.email,
              message: data.message,
              botcheck: data.botcheck || ''
            })
          })
            .then(function (r) { return r.json(); })
            .then(function (r) {
              if (!r.success) throw new Error(r.message || 'refused');
              // Answer in the register the site closes on, not a toast. The
              // details below the form stay put, so the way to reach anyone
              // is still on screen.
              form.innerHTML =
                '<p class="msgDone">' +
                '<span class="msgDoneTitle">Message sent</span>' +
                'You will hear back from hello@sidechain.global' +
                '</p>' +
                '<a class="msgBack" href="/#close">Back to Sidechain</a>';
            })
            .catch(function () {
              btn.disabled = false;
              status.className = 'msgStatus is-warn';
              status.innerHTML =
                'That did not go through. Mail it to ' +
                '<a href="mailto:hello@sidechain.global">hello@sidechain.global</a> instead.';
            });
        });
      }());

      // The landscape only needs to breathe here; there is nothing to scroll
      // through, so the page carries no scroll coupling.
      (function () {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('is-still');
          return;
        }
        var video = document.querySelector('.env-video');
        if (!video) return;
        video.playbackRate = 0.55;
        video.play().catch(function () {});
      }());
    </script>
  </body>
</html>
