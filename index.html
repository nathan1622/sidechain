<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Sidechain — Routing layer for operations and systems</title>

    <meta
      name="description"
      content="Sidechain is a routing layer between people, knowledge, systems and execution. Plug in where complexity starts."
    />

    <link rel="canonical" href="https://sidechain.global" />

    <meta property="og:title" content="Sidechain" />
    <meta property="og:description" content="A routing layer between people, knowledge, systems and execution." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sidechain.global" />
    <meta property="og:image" content="https://sidechain.global/hero.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sidechain" />
    <meta name="twitter:description" content="A routing layer between people, knowledge, systems and execution." />
    <meta name="twitter:image" content="https://sidechain.global/hero.jpg" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="style.css?v=17" />
  </head>

  <body>
    <main class="hero">

      <!-- Video hero — desktop only.
           Falls back to hero.jpg on mobile and prefers-reduced-motion. -->
      <video
        class="hero-video"
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
        aria-hidden="true"
      >
        <source src="hero-video.mp4" type="video/mp4" />
      </video>

      <!-- Loop mask — opacity driven by JS from video.currentTime.
           Starts fully black (opacity:1 in CSS); JS takes over immediately.
           If JS is unavailable, mask stays black and hero.jpg shows through. -->
      <div class="hero-loop-mask" aria-hidden="true"></div>

      <!-- Content -->
      <section class="content" aria-label="Sidechain">
        <img class="hero-logo" src="logo.svg" alt="" aria-hidden="true" />
        <h1 class="brand">SIDECHAIN</h1>
        <p class="tagline t1">Plug in where complexity starts.</p>
        <p class="tagline t2">Learning happens where responsibility is real.</p>
      </section>

    </main>

    <section class="principle" aria-label="Contact">
      <p class="contactAmbient">
        <a href="mailto:hello@sidechain.global">hello@sidechain.global</a>
      </p>
    </section>

    <script>
      (function () {
        const video = document.querySelector('.hero-video');
        const mask  = document.querySelector('.hero-loop-mask');

        // Bail out if elements are missing (e.g. mobile where video is display:none)
        if (!video || !mask) return;

        // Respect system motion preferences — mask stays opaque, hero.jpg shows
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        const FADE_IN  = 1.1;  // seconds: black → clear at video start
        const FADE_OUT = 1.4;  // seconds: clear → black before loop cut

        // Smooth cubic easing — makes the opacity change feel organic, not linear
        function easeInOutCubic(t) {
          return t < 0.5
            ? 4 * t * t * t
            : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function tick() {
          const t   = video.currentTime;
          const dur = video.duration;
          let opacity = 1; // default to black if duration not yet known

          if (dur && !isNaN(dur)) {
            if (t < FADE_IN) {
              // Opening: fades from black to clear over the first 1.1s
              opacity = 1 - easeInOutCubic(t / FADE_IN);
            } else if (dur - t < FADE_OUT) {
              // Closing: fades from clear to black over the last 1.4s
              opacity = 1 - easeInOutCubic((dur - t) / FADE_OUT);
            } else {
              // Middle: fully transparent — video plays unobstructed
              opacity = 0;
            }
          }

          mask.style.opacity = opacity;
          requestAnimationFrame(tick);
        }

        // Start as soon as duration is known
        if (video.readyState >= 1) {
          tick();
        } else {
          video.addEventListener('loadedmetadata', tick, { once: true });
        }
      }());
    </script>
  </body>
</html>
