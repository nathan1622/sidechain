<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not found — Sidechain</title>
    <meta name="robots" content="noindex" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#000000" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        height: 100%;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body {
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
      }

      img { width: 72px; height: 72px; filter: invert(1); margin: 0 auto 32px; display: block; }

      h1 {
        font-size: clamp(11px, 1.3vw, 13px);
        font-weight: 400;
        letter-spacing: 0.30em;
        text-transform: uppercase;
        color: rgba(255,255,255,.55);
        margin-bottom: 20px;
      }

      p {
        font-size: clamp(15px, 1.6vw, 18px);
        font-weight: 300;
        color: rgba(255,255,255,.82);
        margin-bottom: 36px;
      }

      a {
        color: rgba(255,255,255,.82);
        text-decoration: none;
        font-size: 14px;
        letter-spacing: 0.10em;
        border-bottom: 1px solid rgba(255,255,255,.20);
        padding-bottom: 2px;
        transition: color .2s ease, border-bottom-color .2s ease;
      }

      a:hover { color: #fff; border-bottom-color: rgba(255,255,255,.55); }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.svg" width="72" height="72" alt="" aria-hidden="true" />
      <h1>404</h1>
      <p>This route does not exist.</p>
      <a href="/">Back to sidechain.global</a>
    </main>
  </body>
</html>
